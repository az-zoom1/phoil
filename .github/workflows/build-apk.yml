name: Build Vuel Android APK (Capacitor)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Capacitor Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept pre-installed Android SDK licenses
        run: |
          SDK_MGR=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -n "$SDK_MGR" ]; then
            yes | "$SDK_MGR" --licenses >/dev/null 2>&1 || true
          fi

      - name: Install Capacitor dependencies
        run: npm install

      - name: Initialize & sync Capacitor Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          cp capacitor-native/MainActivity.java android/app/src/main/java/com/aistudio/vuel/kzmprq/MainActivity.java
          mkdir -p android/app/src/main/res/xml
          cp app/src/main/res/xml/network_security_config.xml android/app/src/main/res/xml/network_security_config.xml
          rm -f android/app/src/main/res/drawable-v24/ic_launcher_foreground.xml android/app/src/main/res/mipmap-*/ic_launcher_foreground.png
          cp app/src/main/res/drawable/vuel_icon_fg_1794849608305.jpg android/app/src/main/res/drawable/
          cp app/src/main/res/drawable/ic_launcher_foreground.xml android/app/src/main/res/drawable/
          cp app/src/main/res/drawable/ic_launcher_background.xml android/app/src/main/res/drawable/
          cp -r app/src/main/res/mipmap-* android/app/src/main/res/
          python3 - <<'EOF'
          import pathlib
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          txt = p.read_text(encoding="utf-8")
          perms = (
              '    <uses-permission android:name="android.permission.INTERNET" />\n'
              '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n'
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n'
              '    <queries>\n'
              '        <intent><action android:name="android.speech.RecognitionService" /></intent>\n'
              '        <intent><action android:name="android.speech.action.RECOGNIZE_SPEECH" /></intent>\n'
              '        <intent><action android:name="android.intent.action.TTS_SERVICE" /></intent>\n'
              '    </queries>'
          )
          if "RECORD_AUDIO" not in txt:
              txt = txt.replace('<uses-permission android:name="android.permission.INTERNET" />', perms, 1)
          if "networkSecurityConfig" not in txt:
              txt = txt.replace('<application', '<application\n        android:networkSecurityConfig="@xml/network_security_config"', 1)
          p.write_text(txt, encoding="utf-8")
          EOF

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Vuel Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vuel-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
